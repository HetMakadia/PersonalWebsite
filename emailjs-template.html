<div style="margin:0; padding:0; background-color:#efe8dd; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#efe8dd; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#fffaf3; border:1px solid #e2d8c7; border-radius:12px; overflow:hidden;">

          <tr>
            <td style="background-color:#2b2420; padding:24px 32px;">
              <p style="margin:0; color:#f5f1ea; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.7;">Portfolio Contact Form</p>
              <h1 style="margin:6px 0 0; color:#ffffff; font-size:22px; font-weight:700;">New message from {{name}}</h1>
            </td>
          </tr>

          <tr>
            <td style="padding:28px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:20px;">
                <tr>
                  <td style="padding:10px 0; border-bottom:1px solid #e2d8c7; font-size:13px; color:#8a7a68; width:90px;">Name</td>
                  <td style="padding:10px 0; border-bottom:1px solid #e2d8c7; font-size:15px; color:#2b2420; font-weight:600;">{{name}}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0; border-bottom:1px solid #e2d8c7; font-size:13px; color:#8a7a68;">Email</td>
                  <td style="padding:10px 0; border-bottom:1px solid #e2d8c7; font-size:15px;">
                    <a href="mailto:{{email}}" style="color:#3b2a1a; font-weight:600; text-decoration:none;">{{email}}</a>
                  </td>
                </tr>
                <tr>
                  <td style="padding:10px 0; border-bottom:1px solid #e2d8c7; font-size:13px; color:#8a7a68;">Phone</td>
                  <td style="padding:10px 0; border-bottom:1px solid #e2d8c7; font-size:15px; color:#2b2420;">{{phone}}</td>
                </tr>
              </table>

              <p style="margin:0 0 8px; font-size:13px; color:#8a7a68;">Message</p>
              <p style="margin:0; padding:16px; background-color:#f5f1ea; border:1px solid #e2d8c7; border-radius:8px; font-size:15px; line-height:1.6; color:#2b2420; white-space:pre-wrap;">{{message}}</p>

              <div style="margin-top:28px;">
                <a href="mailto:{{email}}" style="display:inline-block; background-color:#3b2a1a; color:#f5f1ea; font-size:14px; font-weight:600; text-decoration:none; padding:12px 24px; border-radius:8px;">Reply to {{name}}</a>
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 32px; background-color:#f5f1ea; border-top:1px solid #e2d8c7;">
              <p style="margin:0; font-size:12px; color:#8a7a68;">Sent from the contact form on your portfolio.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
